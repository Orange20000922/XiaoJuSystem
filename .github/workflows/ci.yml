name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "protobuf>=5,<7" "grpcio-tools>=1.60,<2" "numpy>=1.24,<3"

      - name: Check gRPC contract
        run: python project_src/scripts/generate_grpc_contract.py --check

      - name: Compile sources
        run: python -m compileall -q project_src/src project_src/scripts project_src/configs project_src/models

      - name: Run unit tests
        env:
          PYTHONPATH: project_src
        run: python -m unittest discover -s project_src/src/tests -p "test_*.py" -v
